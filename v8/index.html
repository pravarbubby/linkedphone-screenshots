<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkedPhone Store Screenshots</title>
<link rel="stylesheet" href="kit/ui.css"><link rel="stylesheet" href="kit/desktop.css"><link rel="stylesheet" href="store/store.css">
<style>
  :root { --page: #F4F5FA; --panel: #FFFFFF; --ink: #171A2B; --muted: #6B6E85; --line: #E3E5F2; --accent: #3356FF; --accent-soft: #E9EDFF; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header.db-top { position: sticky; top: 0; z-index: 20; background: rgba(244,245,250,.86); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  .db-bar { display: flex; align-items: center; gap: 14px; padding: 14px 28px 0; flex-wrap: wrap; }
  .db-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.1px; }
  .db-brand svg { width: 26px; height: 26px; }
  .db-ver { font: 600 12px/1 -apple-system, system-ui; color: var(--accent); background: var(--accent-soft); padding: 5px 8px; border-radius: 6px; }
  .db-bar .db-sp { flex: 1; }
  .db-ctl { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .db-ctl input[type=range] { width: 120px; accent-color: var(--accent); }
  .db-ctl label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .db-ctl input[type=checkbox] { accent-color: var(--accent); }
  nav.db-tabs { display: flex; gap: 4px; padding: 12px 22px 0; overflow-x: auto; }
  nav.db-tabs button { appearance: none; border: 0; background: none; padding: 10px 14px 12px; font: 500 14px/1 -apple-system, system-ui; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  nav.db-tabs button .db-n { font-size: 11.5px; font-weight: 600; color: var(--muted); background: #E6E8F3; border-radius: 10px; padding: 3px 7px; }
  nav.db-tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
  nav.db-tabs button[aria-selected=true] .db-n { background: var(--accent-soft); color: var(--accent); }
  nav.db-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
  main { padding: 22px 28px 60px; }
  .db-meta { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; margin-bottom: 18px; color: var(--muted); }
  .db-meta h2 { margin: 0; font-size: 20px; color: var(--ink); letter-spacing: -.2px; }
  .db-strip { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
  .db-card { display: flex; flex-direction: column; gap: 9px; }
  .db-pair { display: flex; gap: 8px; }
  .db-thumb { position: relative; overflow: hidden; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(23,26,43,.06), 0 6px 22px rgba(23,26,43,.07); cursor: zoom-in; }
  .db-thumb.db-ref { cursor: default; outline: 2px dashed #C9CDE6; outline-offset: -2px; }
  .db-thumb > .db-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .db-thumb img { display: block; width: 100%; height: 100%; object-fit: fill; }
  .db-cap { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .db-cap .db-i { font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .db-cap .db-t { font-weight: 500; }
  .db-dl { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); }
  .db-dl:hover { background: #DCE2FF; }
  .db-cap .db-tag { font-size: 11px; color: var(--muted); }
  .db-empty { border: 1.5px dashed #CDD1E8; border-radius: 14px; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 16px; font-size: 13px; }
  .db-lb { position: fixed; inset: 0; z-index: 50; background: rgba(14,16,30,.82); display: none; place-items: center; }
  .db-lb.db-open { display: grid; }
  .db-lb .db-stage { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 20px 80px rgba(0,0,0,.5); }
  .db-lb .db-stage > .db-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .db-lb .db-hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #C9CCE4; font-size: 12.5px; }
  body.render { background: transparent; }
  body.render header, body.render main { display: none; }
  @media (max-width: 640px) { .db-bar, main { padding-left: 16px; padding-right: 16px; } nav.db-tabs { padding-left: 10px; } }
</style></head>
<body>
<header class="db-top">
  <div class="db-bar">
    <div class="db-brand"><svg viewBox="0 0 32 32"><g fill="#3356FF"><circle cx="7" cy="7" r="3.4"/><circle cx="16" cy="7" r="3.4"/><circle cx="25" cy="7" r="3.4"/><circle cx="7" cy="16" r="3.4"/><circle cx="16" cy="16" r="3.4"/><circle cx="25" cy="16" r="3.4"/><circle cx="7" cy="25" r="3.4"/><circle cx="16" cy="25" r="3.4"/><circle cx="25" cy="25" r="3.4"/></g></svg>LinkedPhone · Store Screenshots</div>
    <span class="db-ver">V8</span>
    <span class="db-sp"></span>
    <div class="db-ctl">
      <label id="cmpWrap"><input type="checkbox" id="cmp"> Show originals</label>
      <span>Size</span><input type="range" id="zoom" min="140" max="560" value="300" aria-label="Thumbnail height">
    </div>
  </div>
  <nav class="db-tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="db-lb" id="lb"><div class="db-stage" id="stage"></div><div class="db-hint">Click anywhere or press Esc to close · ← → to step</div></div>

<script src="kit/icons.js"></script><script src="kit/ui.js"></script>
<script>window.SCREENS = window.SCREENS || {};</script>
<script src="screens/inbox.js"></script><script src="screens/onboarding.js"></script><script src="screens/calls.js"></script>
<script src="screens/lisa.js"></script><script src="screens/messaging.js"></script><script src="screens/desktop.js"></script><script src="screens/profile.js"></script>
<script src="store/engine.js"></script><script src="store/m-screens.js"></script><script src="store/d-screens.js"></script><script src="store/widen.js"></script><script src="store/t-screens.js"></script>
<script src="store/slides-ios.js"></script>
<script src="store/slides-ipad.js"></script><script src="store/slides-mac.js"></script><script src="store/slides-android.js"></script>
<script>
const PLATFORMS = [
  { key: 'ios', label: 'iOS', device: 'iPhone 6.9″', size: '1290 × 2796', refs: n => `../refs/ios_${n}.jpg` },
  { key: 'ipad', label: 'iPadOS', device: 'iPad 13″', size: '2064 × 2752' },
  { key: 'mac', label: 'macOS', device: 'Mac', size: '2880 × 1800' },
  { key: 'android', label: 'Android', device: 'Google Play phone', size: '1440 × 2880' },
];
const q = new URLSearchParams(location.search);

// ── render mode: ?only=ios-3 → one slide at 1:1 for export ──
if (q.get('only')) {
  document.body.classList.add('render');
  const [p, n] = q.get('only').split('-');
  const el = STORE[p][+n].build();
  document.body.style.margin = '0';
  document.body.append(el);
  window.READY = true;
} else {
  const tabsEl = document.getElementById('tabs'), main = document.getElementById('main');
  const cmp = document.getElementById('cmp'), zoom = document.getElementById('zoom');
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  let cur = store('tab') || 'ios';
  if (!PLATFORMS.find(p => p.key === cur)) cur = 'ios';
  cmp.checked = store('cmp') === '1';
  zoom.value = store('zoom') || 300;
  const cache = {};
  const built = (p, n) => (cache[p + n] = cache[p + n] || STORE[p][n].build());

  function thumb(p, n, H) {
    const [W0, H0] = STORE.SIZES[p]; const sc = H / H0;
    const t = document.createElement('div'); t.className = 'db-thumb'; t.style.width = W0 * sc + 'px'; t.style.height = H + 'px';
    const inner = document.createElement('div'); inner.className = 'db-inner'; inner.style.cssText = `width:${W0}px;height:${H0}px;transform:scale(${sc})`;
    inner.append(built(p, n)); t.append(inner);
    t.onclick = () => openLB(p, n);
    return t;
  }
  function draw() {
    tabsEl.innerHTML = '';
    PLATFORMS.forEach(P => {
      const b = document.createElement('button'); b.role = 'tab'; b.setAttribute('aria-selected', P.key === cur);
      const n = STORE[P.key].filter(Boolean).length;
      b.innerHTML = `${P.label}<span class="db-n">${n}/10</span>`;
      b.onclick = () => { cur = P.key; store('tab', cur); draw(); };
      tabsEl.append(b);
    });
    const P = PLATFORMS.find(p => p.key === cur);
    document.getElementById('cmpWrap').style.display = P.refs ? '' : 'none';
    main.innerHTML = '';
    const meta = document.createElement('div'); meta.className = 'db-meta';
    meta.innerHTML = `<h2>${P.label}</h2><span>${P.device} · ${P.size} px</span><span>${STORE[P.key].filter(Boolean).length} of 10 slides built</span>`;
    main.append(meta);
    const strip = document.createElement('div'); strip.className = 'db-strip';
    const [W0, H0] = STORE.SIZES[P.key]; const H = Math.round(+zoom.value * (W0 > H0 ? .62 : 1)); const Wt = W0 * H / H0;
    for (let n = 1; n <= 10; n++) {
      const card = document.createElement('div'); card.className = 'db-card';
      const pair = document.createElement('div'); pair.className = 'db-pair';
      const def = STORE[P.key][n];
      if (def) { try { pair.append(thumb(P.key, n, H)); } catch (err) { console.error(err); const x = document.createElement('div'); x.className = 'db-empty'; x.style.cssText = `width:${Wt}px;height:${H}px`; x.textContent = 'Error: ' + err.message; pair.append(x); } }
      else { const x = document.createElement('div'); x.className = 'db-empty'; x.style.cssText = `width:${Wt}px;height:${H}px`; x.textContent = 'In progress'; pair.append(x); }
      if (P.refs && cmp.checked) { const r = document.createElement('div'); r.className = 'db-thumb db-ref'; r.style.cssText = `width:${Wt}px;height:${H}px`; const im = new Image(); im.src = P.refs(n); im.alt = 'Original ' + n; r.append(im); pair.append(r); }
      const cap = document.createElement('div'); cap.className = 'db-cap';
      const nn = String(n).padStart(2, '0');
      cap.innerHTML = `<span class="db-i">${nn}</span><span class="db-t">${def ? def.title : (STORE.ios[n] ? STORE.ios[n].title : '')}</span>` + (def ? `<a class="db-dl" href="../exports/v8/${P.key}/${nn}.png" download="LinkedPhone-${P.key}-${nn}.png">PNG</a>` : '');
      card.append(pair, cap); strip.append(card);
    }
    main.append(strip);
  }
  // lightbox
  const lb = document.getElementById('lb'), stage = document.getElementById('stage'); let lbAt = null;
  function openLB(p, n) {
    lbAt = [p, n]; const [W0, H0] = STORE.SIZES[p];
    const sc = Math.min((innerWidth - 60) / W0, (innerHeight - 70) / H0);
    stage.style.width = W0 * sc + 'px'; stage.style.height = H0 * sc + 'px'; stage.innerHTML = '';
    const inner = document.createElement('div'); inner.className = 'db-inner'; inner.style.cssText = `width:${W0}px;height:${H0}px;transform:scale(${sc})`;
    inner.append(STORE[p][n].build()); stage.append(inner); lb.classList.add('db-open');
  }
  const closeLB = () => { lb.classList.remove('db-open'); stage.innerHTML = ''; lbAt = null; };
  lb.onclick = closeLB;
  addEventListener('keydown', e => {
    if (!lbAt) return;
    if (e.key === 'Escape') closeLB();
    const [p, n] = lbAt, list = STORE[p];
    const step = d => { let m = n; do { m += d; } while (m >= 1 && m <= 10 && !list[m]); if (list[m]) openLB(p, m); };
    if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1);
  });
  cmp.onchange = () => { store('cmp', cmp.checked ? '1' : '0'); draw(); };
  zoom.oninput = () => { store('zoom', zoom.value); draw(); };
  draw();
}
</script>
<script src="../versions-nav.js"></script></body></html>
