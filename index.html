<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkedPhone Store Screenshots</title>
<style>html,body{margin:0;height:100%;background:#F4F5FA;color:#171A2B;font:15px -apple-system,system-ui}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#m{display:grid;place-items:center;min-height:100vh}</style>
</head><body>
<p id="m">Loading…</p>
<script>
// Shows the newest dashboard (last entry in versions.json) under this clean URL. The version picker lives at ./versions/.
fetch('versions.json?t=' + Date.now()).then(r => r.json()).then(l => {
  const f = document.createElement('iframe'); f.title = 'LinkedPhone Store Screenshots'; f.src = l[l.length - 1].v + '/index.html?t=' + Date.now();
  document.body.replaceChildren(f);
}).catch(() => { document.getElementById('m').textContent = 'Could not load versions.json — serve this folder over HTTP (python3 -m http.server).'; });
</script></body></html>
