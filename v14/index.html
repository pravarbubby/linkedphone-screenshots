<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkedPhone Store Screenshots</title>
<link rel="stylesheet" href="kit/ui.css?v=1790853236"><link rel="stylesheet" href="kit/desktop.css?v=1790853236"><link rel="stylesheet" href="store/store.css?v=1790853236">
<style>
  :root { --page: var(--g98); --panel: #FFFFFF; --muted: var(--g40); --line: var(--g90); --accent: var(--blue); --accent-soft: var(--blue95); }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--sf); -webkit-font-smoothing: antialiased; }
  header.db-top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  .db-bar { display: flex; align-items: center; gap: 14px; padding: 14px 28px 0; flex-wrap: wrap; }
  .db-brand { display: flex; align-items: center; gap: 10px; font: 800 18px/1 var(--sf); letter-spacing: -.2px; }
  .db-brand svg { width: 26px; height: 26px; }
  .db-ver { font: 500 13px/1 var(--sf); color: var(--ink); background: var(--blue95); padding: 5px 8px; border-radius: 6px; }
  .db-bar .db-sp { flex: 1; }
  .db-ctl { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .db-ctl input[type=range] { width: 120px; accent-color: var(--accent); }
  .db-ctl label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .db-ctl input[type=checkbox] { accent-color: var(--accent); }
  nav.db-tabs { display: flex; gap: 8px; padding: 14px 28px 14px; overflow-x: auto; scrollbar-width: none; }
  nav.db-tabs::-webkit-scrollbar { display: none; }
  nav.db-tabs button { appearance: none; flex: none; height: 38px; border-radius: 20px; border: 1px solid var(--g90); background: #fff; padding: 0 14px; font: 400 15px/1 var(--sf); color: var(--ink); cursor: pointer; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  nav.db-tabs button:hover { background: var(--g98); }
  nav.db-tabs button .db-n { font: 500 12px/1 var(--sf); color: var(--g40); background: var(--g95); border-radius: 10px; padding: 4px 7px; }
  nav.db-tabs button[aria-selected=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
  nav.db-tabs button[aria-selected=true] .db-n { background: rgba(255,255,255,.18); color: #fff; }
  nav.db-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { padding: 24px 28px 64px; max-width: 1480px; margin: 0 auto; box-sizing: border-box; }
  /* section panel: title + actions + (Android) status — one region for everything that acts on the whole set */
  .db-meta { background: #fff; border: 1px solid var(--g90); border-radius: 16px; margin-bottom: 20px; }
  .db-head { display: flex; gap: 12px 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 16px 20px; }
  .db-meta h2 { margin: 0; font: 700 20px/26px var(--sf); color: var(--ink); letter-spacing: -.3px; }
  .db-sub { color: var(--g40); font: 400 13px/18px var(--sf); }
  .db-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .db-status { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--g95); font: 400 13px/18px var(--sf); color: var(--g40); }
  .db-status:empty { display: none; }
  /* slide grid: equal cards that fill the row */
  .db-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cw), 1fr)); gap: var(--gap); }
  .db-card { display: flex; flex-direction: column; min-width: 0; background: #fff; border: 1px solid var(--g90); border-radius: 14px; overflow: hidden; transition: background .15s, border-color .15s; }
  .db-media { position: relative; display: flex; justify-content: center; padding: 12px; background: var(--g98); border-bottom: 1px solid var(--g95); }
  .db-pair { display: flex; gap: 8px; }
  .db-thumb { position: relative; overflow: hidden; border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px var(--g90); cursor: zoom-in; }
  .db-thumb.db-ref { cursor: default; box-shadow: 0 0 0 1.5px var(--g80); }
  .db-thumb > .db-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .db-thumb img { display: block; width: 100%; height: 100%; object-fit: fill; }
  .db-cap { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px 8px; }
  .db-cap .db-i { flex: none; width: 26px; height: 20px; border-radius: 6px; background: var(--blue95); font: 600 12px/20px var(--sf); color: var(--blue); text-align: center; }
  .db-cap .db-t { flex: 1; min-width: 0; font: 600 14px/20px var(--sf); color: var(--ink); min-height: 40px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .db-foot { display: flex; align-items: center; gap: 8px; min-height: 40px; margin-top: auto; padding: 0 8px 0 12px; border-top: 1px solid var(--g95); font: 400 12px/1 var(--sf); color: var(--g50); }
  .db-foot:empty { display: none; }
  .db-dl { display: none; }
  .db-empty { border: 1.5px dashed var(--g80); border-radius: 8px; display: grid; place-items: center; color: var(--g40); text-align: center; padding: 16px; font-size: 13px; box-sizing: border-box; }
  .db-lb { position: fixed; inset: 0; z-index: 50; background: rgba(14,16,30,.82); display: none; place-items: center; }
  .db-lb.db-open { display: grid; }
  .db-lb .db-stage { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 20px 80px rgba(0,0,0,.5); }
  .db-lb .db-stage > .db-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .db-lb .db-hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #C9CCE4; font-size: 12.5px; }
  body.render { background: transparent; }
  body.render header, body.render main { display: none; }
  @media (max-width: 640px) { .db-bar, main, nav.db-tabs { padding-left: 16px; padding-right: 16px; } .db-head, .db-status { padding-left: 14px; padding-right: 14px; } .db-media { padding: 8px; } .db-actions, .db-actions > * { width: 100%; justify-content: center; } .db-brand { font-size: 16px; } .db-brand .db-co { display: none; } #cmpWrap { display: none !important; } .db-bar { flex-wrap: nowrap; padding-top: 12px; } .db-bar .db-sp { min-width: 0; } .db-ctl > span, .db-ctl input[type=range] { display: none; } }
</style></head>
<body>
<header class="db-top">
  <div class="db-bar">
    <div class="db-brand"><svg viewBox="0 0 100 100"><path d="M38.2 61.8h-7.8a7.8 7.8 0 1 0 7.8 7.8Zm39.2-23.9a15.3 15.3 0 0 0-30.5 0v15.3h15.2c8.4 0 15.3-6.9 15.3-15.3Zm8.6 0c0 13.2-10.7 23.9-23.9 23.9H46.8v7.8a16.4 16.4 0 1 1-16.4-16.4h7.8V37.9a23.9 23.9 0 0 1 47.8 0Z" fill="#3356FF"/></svg><span><span class="db-co">LinkedPhone · </span>Store Screenshots</span></div>
    <span class="db-ver">V14</span>
    <span class="db-sp"></span>
    <div class="db-ctl">
      <label id="cmpWrap"><input type="checkbox" id="cmp"> Show originals</label>
      <span>Size</span><input type="range" id="zoom" min="140" max="560" value="300" aria-label="Thumbnail height">
    </div>
  </div>
  <nav class="db-tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="db-lb" id="lb"><div class="db-stage" id="stage"></div><div class="db-hint">Click anywhere or press Esc to close · ← → to step</div></div>

<script src="screens/inbox.js?v=1790853236"></script><script src="screens/onboarding.js?v=1790853236"></script><script src="screens/calls.js?v=1790853236"></script>
<script src="screens/lisa.js?v=1790853236"></script><script src="screens/messaging.js?v=1790853236"></script><script src="screens/desktop.js?v=1790853236"></script><script src="screens/profile.js?v=1790853236"></script>
<script src="store/engine.js?v=1790853236"></script><script src="store/m-screens.js?v=1790853236"></script><script src="store/d-screens.js?v=1790853236"></script><script src="store/widen.js?v=1790853236"></script><script src="store/t-screens.js?v=1790853236"></script>

<script src="store/slides-ipad.js?v=1790853236"></script><script src="store/slides-mac.js?v=1790853236"></script><script src="store/slides-android.js?v=1790853236"></script>
<script>
const PLATFORMS = [
  { key: 'ios', label: 'iOS', device: 'iPhone 6.9″', size: '1290 × 2796', refs: n => `../refs/ios_${n}.jpg` },
  { key: 'ipad', label: 'iPadOS', device: 'iPad 13″', size: '2064 × 2752' },
  { key: 'mac', label: 'macOS', device: 'Mac', size: '2880 × 1800' },
  { key: 'android', label: 'Android', device: 'Google Play phone', size: '1440 × 2880' },
  { key: 'androidS', label: 'Android small', device: 'Google Play phone (small)', size: '900 × 1600' },
];
const q = new URLSearchParams(location.search);
const VER = (location.pathname.match(/\/(v\d+)\//) || [])[1] || 'v14';

// ── render mode: ?only=ios-3 → one slide at 1:1 for export ──
if (q.get('only')) {
  document.body.classList.add('render');
  const [p, n] = q.get('only').split('-');
  const el = STORE[p][+n].build();
  document.body.style.margin = '0';
  document.body.append(el);
  window.READY = true;
} else {
  const tabsEl = document.getElementById('tabs'), main = document.getElementById('main');
  const cmp = document.getElementById('cmp'), zoom = document.getElementById('zoom');
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  let cur = store('tab') || 'ios';
  if (!PLATFORMS.find(p => p.key === cur)) cur = 'ios';
  cmp.checked = store('cmp') === '1';
  zoom.value = store('zoom') || 300;
  const cache = {};
  const built = (p, n) => (cache[p + n] = cache[p + n] || STORE[p][n].build());

  function thumb(p, n, H) {
    const [W0, H0] = STORE.SIZES[p]; const sc = H / H0;
    const t = document.createElement('div'); t.className = 'db-thumb'; t.style.width = W0 * sc + 'px'; t.style.height = H + 'px';
    const inner = document.createElement('div'); inner.className = 'db-inner'; inner.style.cssText = `width:${W0}px;height:${H0}px;transform:scale(${sc})`;
    inner.append(built(p, n)); t.append(inner);
    t.onclick = () => openLB(p, n);
    return t;
  }
  function draw() {
    tabsEl.innerHTML = '';
    PLATFORMS.forEach(P => {
      const b = document.createElement('button'); b.role = 'tab'; b.setAttribute('aria-selected', P.key === cur);
      b.textContent = P.label;
      b.onclick = () => { cur = P.key; store('tab', cur); draw(); };
      tabsEl.append(b);
    });
    const P = PLATFORMS.find(p => p.key === cur);
    document.getElementById('cmpWrap').style.display = P.refs ? '' : 'none';
    main.innerHTML = '';
    const meta = document.createElement('div'); meta.className = 'db-meta';
    const builtN = (STORE[P.key] || []).filter(Boolean).length;
    meta.innerHTML = `<div class="db-head"><div class="db-titles"><h2>${P.label}</h2><div class="db-sub">${P.device} · ${P.size} px${builtN < 10 ? ` · ${builtN} of 10 slides built` : ''}</div></div><div class="db-actions"></div></div><div class="db-status"></div>`;
    main.append(meta);
    const strip = document.createElement('div'); strip.className = 'db-strip';
    // Thumbnail size: the Size slider, capped so a phone fits two portrait (or one landscape) cards per row.
    const [W0, H0] = STORE.SIZES[P.key], per = P.refs && cmp.checked ? 2 : 1, gap = innerWidth <= 640 ? 10 : 16, pad = innerWidth <= 640 ? 18 : 26;
    const avail = main.clientWidth - parseFloat(getComputedStyle(main).paddingLeft) * 2;
    const cols = W0 > H0 ? 1 : 2, maxW = (Math.floor((avail - gap * (cols - 1)) / cols) - 2 - pad - (per - 1) * 8) / per;
    const H = Math.round(Math.min(+zoom.value * (W0 > H0 ? .62 : 1), maxW * H0 / W0)); const Wt = W0 * H / H0;
    strip.style.setProperty('--cw', Math.floor(Wt * per + (per - 1) * 8 + pad + 2) + 'px'); strip.style.setProperty('--gap', gap + 'px');
    for (let n = 1; n <= 10; n++) {
      const card = document.createElement('div'); card.className = 'db-card';
      const pair = document.createElement('div'); pair.className = 'db-pair';
      const def = (STORE[P.key] || [])[n];
      if (def) { try { pair.append(thumb(P.key, n, H)); } catch (err) { console.error(err); const x = document.createElement('div'); x.className = 'db-empty'; x.style.cssText = `width:${Wt}px;height:${H}px`; x.textContent = 'Error: ' + err.message; pair.append(x); } }
      else { const x = document.createElement('div'); x.className = 'db-empty'; x.style.cssText = `width:${Wt}px;height:${H}px`; x.textContent = 'In progress'; pair.append(x); }
      if (P.refs && cmp.checked) { const r = document.createElement('div'); r.className = 'db-thumb db-ref'; r.style.cssText = `width:${Wt}px;height:${H}px`; const im = new Image(); im.src = P.refs(n); im.alt = 'Original ' + n; r.append(im); pair.append(r); }
      const cap = document.createElement('div'); cap.className = 'db-cap';
      const nn = String(n).padStart(2, '0');
      cap.innerHTML = `<span class="db-i">${nn}</span><span class="db-t">${def ? def.title : (STORE.ios[n] ? STORE.ios[n].title : '')}</span>` + (def ? `<a class="db-dl" href="../exports/${VER}/${P.key}/${nn}.png" download="LinkedPhone-${P.key}-${nn}.png">PNG</a>` : '');
      const media = document.createElement('div'); media.className = 'db-media'; media.append(pair);
      const foot = document.createElement('div'); foot.className = 'db-foot';
      card.append(media, cap, foot); strip.append(card);
    }
    main.append(strip);
  }
  // lightbox
  const lb = document.getElementById('lb'), stage = document.getElementById('stage'); let lbAt = null;
  function openLB(p, n) {
    lbAt = [p, n]; const [W0, H0] = STORE.SIZES[p];
    const sc = Math.min((innerWidth - 60) / W0, (innerHeight - 70) / H0);
    stage.style.width = W0 * sc + 'px'; stage.style.height = H0 * sc + 'px'; stage.innerHTML = '';
    const inner = document.createElement('div'); inner.className = 'db-inner'; inner.style.cssText = `width:${W0}px;height:${H0}px;transform:scale(${sc})`;
    inner.append(STORE[p][n].build()); stage.append(inner); lb.classList.add('db-open');
  }
  const closeLB = () => { lb.classList.remove('db-open'); stage.innerHTML = ''; lbAt = null; };
  lb.onclick = closeLB;
  addEventListener('keydown', e => {
    if (!lbAt) return;
    if (e.key === 'Escape') closeLB();
    const [p, n] = lbAt, list = STORE[p];
    const step = d => { let m = n; do { m += d; } while (m >= 1 && m <= 10 && !list[m]); if (list[m]) openLB(p, m); };
    if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1);
  });
  cmp.onchange = () => { store('cmp', cmp.checked ? '1' : '0'); draw(); };
  zoom.oninput = () => { store('zoom', zoom.value); draw(); };
  let lastW = innerWidth, rt; addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(draw, 150); });
  draw();
}
</script>
